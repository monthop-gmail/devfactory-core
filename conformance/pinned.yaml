# เวอร์ชันของ agent-platform ที่ repo นี้ conform อยู่
#
# อัปเกรดเป็น PR แยกเสมอ: เปลี่ยน commit ที่นี่ → รัน payload_check → แก้สิ่งที่พัง → ค่อย merge
# ห้ามอัปเกรดปนกับงาน feature เพราะจะแยกไม่ออกว่าอะไรพังเพราะ contract หรือเพราะ code

repo: monthop-gmail/agent-platform
ref: main
commit: 3a01ab9d0a68594463382b0ec618dc07ccf6408c
pinned_at: "2026-08-19"

# contract ที่ platform-contract.yaml pin ไว้ และไฟล์ที่ต้องมีใน registry เพื่อ resolve $ref
# event/v1 อ้างถึง identity · policy · capability · model · error จึงต้องดึงมาทั้งชุด
schemas:
  - identity/v1/identity.schema.yaml
  - event/v1/event.schema.yaml
  - approval/v1/approval.schema.yaml
  - policy/v1/policy-decision.schema.yaml
  - execution/v1/execution.schema.yaml
  - capability/v1/capability.schema.yaml
  - model/v1/inference.schema.yaml
  - error/v1/error.schema.yaml

# key ระดับบนสุดใน schema ของ platform ที่ไม่ใช่ JSON Schema — ต้องตัดก่อน validate
# ไม่ใช่ข้อบกพร่องของเขา: เป็นที่ที่เขาบันทึก provenance และ semantics ที่เครื่องอ่านได้
non_schema_keys:
  - derived_from
  - guarantees
  - platform_rules
  - transitions
  - retry_policy
  - parallel_substates
  - Request
  - Decision

# guarantee ของ event/v1 ที่ implementation ของเราลดทอนไม่ได้
# JSON Schema ตรวจข้อเหล่านี้ไม่ได้ — scenario ใน payload_check.py เป็นคนตรวจ
guarantees:
  - event เป็น append-only
  - no silent state change — ทุกการเปลี่ยน state ต้องมี event
  - ทุก event ต้องตอบได้ว่าเกี่ยวกับอะไร — subject จำเป็นเสมอ
  - ห้ามสร้าง job_id ปลอมหรือ default ให้ event ที่ไม่มี job
  - event ที่ resolve tenant ไม่ได้ ให้ reject ที่ intake
  - external event ต้องคง source ไว้
  - ห้ามเก็บ private reasoning / chain-of-thought เป็น audit record
  - event ที่ devfactory-core ส่งออกต้องมี job_id เสมอ

# ช่องว่างที่รู้ตัว — พร้อม issue อ้างอิงและเงื่อนไขที่แคบที่สุดเท่าที่จะแคบได้
#
# payload_check ยอมให้ failure ที่เข้าเงื่อนไขในลิสต์นี้เท่านั้นผ่านไปได้
# failure อื่นทุกแบบทำให้ run แดง · การเพิ่มรายการต้องมี issue และวันหมดอายุเสมอ
#
# ⚠️ ลิสต์นี้เป็นของที่ทำงานจริง ไม่ใช่บันทึก — รายการที่ค้างอยู่หลังปัญหาถูกแก้แล้ว
#    ไม่ได้เฉย ๆ มันยัง "กลืน" failure ที่ตรงเงื่อนไขต่อไป ทำให้ของใหม่ที่พังตรงจุดเดิม
#    ผ่านไปเงียบ ๆ · เมื่อ issue ปิดและ pin ขยับถึงตัวแก้แล้ว ให้ถอดออกทันที
#    ประวัติว่าเคยเบี่ยงเพราะอะไร เก็บที่ platform-contract.yaml `gaps:` ซึ่งเป็นบันทึก
known_gaps: []
# ว่างตั้งแต่ 2026-08-21 — event-type-enum-closed (agent-platform#17) ถอดออกแล้ว
# เขาแก้ที่ schema ตั้งแต่ 2026-08-18: field event_type อ้าง EventTypeName (ชุดเปิด)
# ไม่ได้อ้าง $defs.EventType (ชุดปิด) อีกต่อไป · pin ปัจจุบันมีตัวแก้นั้นแล้ว
# ตรวจก่อนถอด: ไม่มี event สักตัวที่ต้องพึ่ง waiver นี้ และมันยังกลืน event_type
# ที่ผิดรูปจริง ๆ ได้ (ทดสอบด้วย "sighting recorded!!" แล้วผ่านเป็นสีเขียว)
