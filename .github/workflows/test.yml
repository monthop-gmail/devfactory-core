name: test

# The release gate ADR-0006 requires of a consumer: unit tests for both packages
# plus payload conformance against the pinned contracts. Issue #7 adds the
# end-to-end flow simulation, which is the closing gate on milestone v0.1.
#
# A failing job here has to block the merge for this to be a gate rather than a
# report. That needs branch protection with these checks marked required, which is
# a repository setting and not something this file can assert.

# ไม่มี paths: filter โดยเจตนา — check เหล่านี้เป็น required check ของ branch protection
# และ required check ที่ไม่ทำงานจะไม่รายงานผล ทำให้ PR ค้างที่ "Expected — waiting for
# status to be reported" ตลอดไป · PR ที่แตะแค่ rfcs/ หรือ README จะติดกับดักนั้นพอดี
# ซึ่งเป็น PR ที่ repo นี้เปิดบ่อยที่สุด
#
# ราคาที่จ่ายคือรันชุดเทสต์กับ PR ที่เป็นเอกสารล้วน ~1 นาที ซึ่งถูกกว่าการมี gate
# ที่บล็อกงานผิดชนิด
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        # observability imports devfactory_core, so core is installed first.
        # Both are path installs — neither is a published distribution.
        run: |
          pip install --no-cache-dir -e './packages/core[test]'
          pip install --no-cache-dir -e './packages/observability[test]'

      - name: Test core
        working-directory: packages/core
        run: python -m pytest --cov=devfactory_core --cov-report=term-missing

      - name: Test observability
        working-directory: packages/observability
        run: python -m pytest --cov=devfactory_observability --cov-report=term-missing

  simulation:
    # Issue #7 — the end-to-end flow simulation. Runs both forms deliberately:
    # the test suite is what fails a pull request, and the script is the
    # deliverable the issue asks for, so a script that stopped running would be a
    # regression the suite alone might not notice.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install --no-cache-dir 'pytest>=8'

      - name: End-to-end flow suite
        run: python3 -m pytest simulation/tests

      - name: End-to-end flow simulation
        run: python3 simulation/e2e_flow.py

  conformance:
    # ADR-0006 requirement 2 — validate payloads the engine actually produces
    # against the contracts pinned in conformance/pinned.yaml.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install --no-cache-dir 'pyyaml==6.*' 'jsonschema==4.*' 'referencing==0.*'

      - name: Payload conformance
        run: python3 conformance/payload_check.py
