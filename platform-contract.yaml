# Consumer manifest — ประกาศว่า repo นี้ยึด contract อะไรของ agent-platform
#
# รูปแบบตาม ADR-0006:
#   https://github.com/monthop-gmail/agent-platform/blob/main/decisions/0006-contract-versioning.md
# เหตุผลและขอบเขต authority ตาม RFC-0005:
#   rfcs/0005-platform-contract-authority.md
# semantics ที่ repo นี้เป็นเจ้าของ (สำหรับ agent-platform ใช้ derive contract):
#   contract-semantics.yaml

platform_contract_version: "0.1"

contracts:
  - identity/v1     # tenant · workspace · principal (RFC-0006)
  - execution/v1    # execution ชั้นล่างของ job state machine (RFC-0001 + RFC-0007)
  - policy/v1       # policy decision — คนละอย่างกับ approval
  - error/v1
  - approval/v1     # derive จาก rfcs/0002 — publish แล้ว 2026-08-18 (ADR-0006 C2)
  - event/v1        # derive จาก rfcs/0003 + rfcs/0008 — publish แล้ว 2026-08-18

conformance:
  status: passing
  last_verified: 2026-09-20   # รันกับ pin 7c229955 — passed=70 FAIL=0

  # ADR-0006 บังคับ consumer 3 ข้อ — ครบแล้วทั้งสาม:
  #   1. manifest        ไฟล์นี้
  #   2. conformance test ใน CI ที่ validate payload จริง
  #                      conformance/payload_check.py — รัน scenario ผ่าน job state
  #                      machine และ event log จริง แล้ว validate event 61 ตัว
  #                      กับ event/v1 ที่ pin ไว้ และ decision 8 ใบกับ approval/v1
  #                      · ไม่มี fixture ที่เขียนขึ้นเพื่อให้ schema ผ่าน
  #                      · ตรวจ "ชื่อ" field ของ approval ด้วย เพราะ approval/v1 ไม่ได้ปิด
  #                        additionalProperties — field ที่เราตั้งชื่อเองจึง valid เงียบ ๆ
  #   3. release gate    job `core` · `conformance` · `simulation` ใน
  #                      .github/workflows/test.yml รันทุก PR และเป็น required
  #                      status check ของ branch protection ตั้งแต่ 2026-08-22
  #                      พร้อม enforce_admins — test แดงแล้ว merge ไม่ได้จริง
  #                      ไม่ใช่แค่เขียนไว้ (ทดสอบด้วยการ push ตรงเข้า main แล้วถูกปฏิเสธ)
  #
  # และตรวจ leaf ทุกใบว่าเป็นข้อความที่ประกาศไว้หรือเป็นตัวชี้ (rfcs/0013)
  # โดยอ่านการประกาศจาก contract-semantics.yaml ไม่ได้ถือรายการของตัวเอง
  #
  # นอกจาก schema แล้ว payload_check ยังตรวจ guarantee ของ event/v1 อีก 8 ข้อ
  # ที่ JSON Schema ตรวจไม่ได้ — append-only · no silent state change · subject
  # ตอบได้เสมอ · ไม่ปลอม job_id · reject tenant ที่ resolve ไม่ได้ · คง source
  # ของ external · ไม่เก็บ reasoning · tenant partition ไม่ปนกัน

pinned_contracts_commit: 7c229955f722a1581ff9a47d6f43b67b81507ff9   # conformance/pinned.yaml

# ช่องว่างจาก consumer pilot ของ agent-platform และ RFC ที่ปิดแต่ละข้อ
# รายละเอียดเต็ม: agent-platform/architecture/consumer-devfactory-core.md
# ติดตามที่ issue #8
blocking:
  - id: tenant-model
    detail: >-
      ไม่มี tenant/workspace ในเอกสารใดเลย แต่ ADR-0007 กำหนดให้ tenant_id
      เป็น required ทุก contract
    severity: high
    resolved_by: rfcs/0006-tenant-workspace-model.md
    status: specified   # เอกสารครบแล้ว · ยังไม่มี code

  - id: job-retry-semantics
    detail: >-
      RFC-0001 ระบุ "FAILED is terminal" ส่วน execution/v1 retry ได้
      ระดับ job ยังไม่มีคำตอบ (RFC-0001 เขียน Open Question ข้อนี้ไว้เอง)
    severity: medium
    resolved_by: rfcs/0007-job-lifecycle-completeness.md
    status: specified   # FAILED ยัง terminal · recovery = job ใหม่ที่มี supersedes_job_id

  - id: missing-terminal-states
    detail: RFC-0001 ไม่มี cancelled และ timed_out ซึ่ง execution/v1 มี
    severity: medium
    resolved_by: rfcs/0007-job-lifecycle-completeness.md
    status: specified   # เพิ่ม CANCELLED และ TIMED_OUT เป็น terminal ระดับ job

  - id: mid-run-approval-invisible
    detail: >-
      execution ที่เข้า awaiting_approval กลางคัน ไม่มีวิธีแสดงที่ระดับ job
      — job ยังเป็น IN_PROGRESS เฉย ๆ มองไม่ออกว่ากำลังรอคน
    severity: medium
    resolved_by: rfcs/0007-job-lifecycle-completeness.md
    status: specified   # เพิ่ม state AWAITING_APPROVAL + field awaiting_from

  - id: event-job-id-required
    detail: >-
      RFC-0003 บังคับ job_id แต่ event จากระบบอื่นไม่ได้เกิดจาก job เสมอ
    severity: low
    resolved_by: rfcs/0008-external-event-intake.md
    status: specified   # job_id optional · subject_type/subject_id required · ห้ามสร้าง job_id ปลอม

  - id: plane-naming
    detail: >-
      packages/proxy = "Provider proxy" (outbound) ซึ่งตรงกับ model-gateway ใน ADR-0003
      และ apps/api-gateway ยังไม่ระบุทิศทาง
    severity: low
    resolved_by: rfcs/0005-platform-contract-authority.md
    status: done        # เปลี่ยนชื่อเป็น packages/provider-proxy และ apps/control-api · internal ทั้งคู่

# ที่ยังเหลือจริง ๆ ตอนนี้คือ code — ไม่ใช่เอกสาร
remaining:
  - >-
    constructor ของ Job รับ supersedes_job_id โดยตรวจได้แค่สองอย่าง — รูปแบบ id
    และห้ามชี้ตัวเอง (SelfSupersedingJob) · ที่ยังตรวจไม่ได้คือใบที่อ้างมีจริงไหม
    อยู่ tenant เดียวกันไหม จบแบบไม่ได้ส่งมอบงานจริงไหม (rfcs/0007 Amendment 2)
    · Job.supersede() ซึ่งถือ job ทั้งสองใบอยู่ในมือบังคับกฎครบ
    ประตูที่ยังเปิดคือทางที่ข้ามมันไป
    · ปิดให้ครบต้องมี registry ของ job ซึ่งต้องมี durable store ก่อน
    — งานเดียวกับ trigger ของ issue #32 และ checkpoint ที่ rfcs/0012 Decision 4 ระบุไว้
# ADR-0034 ข้อ 7 ของ agent-platform — เมื่อ semantics_version ขยับ และ "ขอบเขต"
# ของ invariant เปลี่ยน ผู้ผลิตต้องตอบว่าตัวตรวจของตัวเองครอบขอบเขตใหม่แล้วหรือยัง
#
# กฎนี้มาจาก care-agent-platform ซึ่งพิสูจน์มันในรอบเดียวกัน — เขาขยายตัวไล่ leaf
# ให้ครอบใบอนุมัติหลัง rfcs/0017 แล้วมันฟ้อง $.authority.display_name ในรอบแรก
#
# เราเป็นทั้งเจ้าของ semantics และผู้ผลิต event จึงต้องตอบข้อนี้เหมือนคนอื่น
# · "ไม่มีอะไรต้องทำ" กับ "ยังไม่ได้ดู" หน้าตาเหมือนกันถ้าไม่เขียน
scope_change_answers:
  - semantics_version: "1.5"
    rfc: rfcs/0017-the-leaf-rule-is-not-a-property-of-one-contract.md
    scope_change: >-
      กฎ leaf เลิกเป็นคุณสมบัติของ event/v1 — ผูกทุกสัญญาที่ semantics เป็นของ repo นี้
      · payload ชนิดใหม่ที่ต้องถูกไล่คือใบอนุมัติ (approval/v1)
    checker_covers_it: true
    how_we_know: >-
      ไล่จริง ไม่ได้อนุมาน · สร้าง Principal ที่พา display_name มาทั้งผู้ยื่นและผู้อนุมัติ
      แล้วดู payload ที่ออกมา — authority เหลือ {type, id} · leaf ที่ลงท้าย
      display_name = 0 · check_text_fields ผ่าน
    why_it_was_already_covered: >-
      (1) การตัด display_name เป็น recursive จากจุดเดียวใน Principal.as_payload
      จึงครอบ authority และ on_behalf_of ที่ซ้อนกันโดยไม่ต้องไล่ทีละเส้นทาง
      · (2) Decision.as_payload() ถูกเรียกที่เดียวคือตอนฝังลง metadata.approval
      ของ event — ใบอนุมัติแบบยืนเดี่ยวกับใบที่ฝังอยู่จึงเป็นออบเจกต์เดียวกัน
      และตัวไล่ leaf ที่เดินบน event เดินครบอยู่แล้ว
    what_guards_it: >-
      packages/core/tests/test_decisions.py — assert decision_event["metadata"]["approval"]
      == record.as_payload() · ล็อกว่ามีทางเรนเดอร์ทางเดียว
    honest_limit: >-
      ข้อ (2) เป็นผลพลอยได้จากการที่ยังไม่มี control API ไม่ใช่การออกแบบ
      · วันที่มีปลายทางที่สอง จะมีทางเรนเดอร์ที่สอง และเทสต์ข้างบนจะไม่รู้เรื่อง
      เว้นแต่ทางใหม่เขียนทับ metadata.approval ด้วย — ต้องกลับมาตอบข้อนี้ใหม่ตอนนั้น

registration: conforming   # registered | conforming

# ช่องว่างที่ค้างอยู่ฝั่ง contract ไม่ใช่ฝั่ง implementation
# ตามแบบที่ care-agent-platform ทำ — บันทึกไว้ให้ platform เห็นโดยไม่ต้องมาถาม
#
# ข้อที่ปิดแล้วไม่ลบทิ้ง แต่ติด `status: resolved` ไว้แบบเดียวกับ blocking: ข้างบน
# — เหตุผลที่เราเคยเบี่ยงจาก contract คือสิ่งที่คนอ่านโค้ดเก่าจะถามถึง
# อ่านเฉพาะข้อที่ไม่มี status: resolved ถ้าอยากรู้ว่าตอนนี้ยังค้างอะไร
gaps:
  - id: event-type-enum-closed
    issue: https://github.com/monthop-gmail/agent-platform/issues/17
    detail: >-
      event/v1 $defs.EventType ยังเป็น enum ปิด 7 ค่า ซึ่งขัดกับ platform_rules
      ของไฟล์เดียวกันและขัดกับ ADR-0006 Rule 2 ฉบับแก้ (RFC-0009) ที่ตัดสินว่า
      vocabulary เป็นชุดเปิด — event จากภายนอกอย่าง SIGHTING_RECORDED
      จึง validate ไม่ผ่าน · เจอโดย payload_check รอบแรก
    workaround: >-
      บันทึกเป็น known_gaps ใน conformance/pinned.yaml แคบไว้ที่ field event_type
      ของ event ที่ source.kind = external เท่านั้น · หมดอายุ 2026-11-18
    severity: low
    resolved_by: agent-platform#17 — field event_type อ้าง EventTypeName (ชุดเปิด, pattern
      ^[A-Z][A-Z0-9_]{2,63}$) แทน $defs.EventType (ชุดปิด) · $defs.EventType เก็บไว้ให้
      consumer generate constant ของค่าที่ platform รับรองความหมาย
    status: resolved   # ปิดที่ต้นทาง 2026-08-18 · ถอด waiver ออกจาก pinned.yaml 2026-08-21
    note: >-
      ตอนถอดพบว่า waiver ที่ค้างไว้ไม่ได้เฉย ๆ — มันยังกลืน event_type ที่ผิดรูปจริง
      (ทดสอบด้วย "sighting recorded!!" จาก source ภายนอก แล้ว run ยังเขียว) เพราะเงื่อนไข
      ของมันคือ "error ที่ field event_type ของ event ภายนอก" ซึ่งครอบทั้งค่าที่ไม่รู้จัก
      และค่าที่ผิดรูป · จึงถอด waiver พร้อมกับให้ intake ปฏิเสธค่าที่ผิดรูปตั้งแต่ขอบ
      (MalformedEventType) — "ไม่รู้จัก" ยังเก็บไว้ตาม event/v1 ส่วน "ผิดรูป" ไม่ใช่ค่า

  - id: approval-supersedes-field-missing
    issue: https://github.com/monthop-gmail/agent-platform/issues/22   # เปิดแล้ว 2026-08-19 (พบตอนทำ issue #5)
    detail: >-
      approval/v1 มี guarantee ว่า "decision เป็น immutable · การเปลี่ยนใจคือ approval
      ใบใหม่ที่อ้างใบเดิม" แต่ schema ไม่มี field ให้ใส่การอ้างนั้นเลย — ทำตาม guarantee
      แล้วไม่มีที่เก็บผลลัพธ์
    severity: low
    resolved_by: agent-platform#24 — approval/v1 v1.1.0 · field ชื่อ supersedes_approval_id
    status: resolved   # ปิดแล้ว 2026-08-19 · pin ขยับเป็น 3a01ab9 ใน PR #23
    note: >-
      ระหว่างที่ยังไม่มี field ฝั่งเราใส่ชื่อของตัวเองคือ supersedes_decision_id ลงใน payload
      (approval/v1 ไม่ได้ตั้ง additionalProperties: false จึงยัง validate ผ่าน) และเขียนไว้ว่า
      ถ้า agent-platform ตั้งชื่อเอง งานที่เหลือคือ rename ไม่ใช่ออกแบบใหม่ — ผลออกมาตามนั้น
      · เขาไม่ใช้ชื่อของเราเพราะค่าที่ใส่คือ approval_id จริง ๆ (decision เป็น enum ไม่มี id)
      และคำว่า decision ชนกับผลประเมินของเครื่องใน policy/v1
      · payload ฝั่งเราใช้ supersedes_approval_id แล้ว ส่วนชื่อใน Python ยังเป็น
      supersedes_decision_id ตาม convention เดิม decision_id → approval_id (RFC-0005 Rule 1)
      map อยู่ที่เดียวคือ decision.WIRE_FIELD_NAMES
      · payload_check ตรวจชื่อ field ที่เราผลิตแล้ว — schema ยังไม่ปิด additionalProperties
      ชื่อผิดจึงยัง validate ผ่านโดยไม่มีใครทัก
      · invariant ที่ v1.1.0 ฝากไว้กับผู้ผลิต (ใบที่อ้างต้องมีจริง · tenant เดียวกัน ·
      subject เดียวกัน · ห้ามชี้ตัวเอง · ห้ามเป็นวง) ทางเดินปกติของ Job.decide ทำครบ
      แต่ถ้า caller ส่ง supersedes_decision_id เข้ามาเองยังไม่มีใครตรวจ — ดู remaining:

  - id: rfc-0013-rule-not-carried
    issue: https://github.com/monthop-gmail/agent-platform/issues/74   # เปิด 2026-09-18
    detail: >-
      event/v1 v1.7.1 ที่ commit a5138dfe ประกาศ semantics_version "1.3" และใส่
      rfcs/0013 ไว้ใน derived_from.rfcs แต่ทั้งเอกสารไม่มีคำว่า leaf — ไม่มีข้อใน
      guarantees.rules ไม่มีใน platform_rules · กฎถูกอ้างถึง แต่ไม่ได้ถูกพกมา
      · ค้นทั้ง repo ต้นทางแล้ว leaf โผล่ที่เดียวคือคำอธิบาย display_name ใน
      identity/v1 ซึ่งเป็น ADR-0031 คนละเรื่อง
    found_by: >-
      care-agent-platform#28 ไม่ใช่เช็คของเรา — เขาเขียนไว้ตอนอัปเกรด pin แล้วเราไปตรวจตาม
    why_nothing_caught_it: >-
      drift check ของ agent-platform เทียบ semantics_version ซึ่งตรง · payload_check
      ของเราเทียบ payload กับ schema ซึ่งผ่าน · pin_freshness เทียบอายุซึ่งสด
      · payload_check ของ care ไล่ leaf จริง 115 ใบซึ่งผ่าน เพราะทะเบียนคีย์ปิดของเขา
      ลดค่าขาเข้าเป็น token ตั้งแต่ intake · ไม่มีเกตไหนถามว่าสัญญาพกกฎมาด้วยหรือเปล่า
    workaround: >-
      บันทึกเป็น not_carried_yet ใน contract-semantics.yaml → carried_check
      พร้อม issue และวันหมดอายุ 2026-10-31 · และเพิ่มเช็คใหม่ที่เทียบ frozen ของเรา
      กับสัญญาที่ pin ไว้ทุกครั้งที่ payload_check รัน — ช่องแบบนี้จะไม่เงียบอีก
    acceptable_answers: >-
      สองทาง: (1) พกกฎมา ถ้อยคำเป็นของ agent-platform ตาม rfcs/0005 Rule 1
      · (2) บอกว่าไม่ควรพกมาพร้อมเหตุผล แล้วเราเปลี่ยนเป็น ours_only
      — ข้อ 2 ถูกได้จริง เพราะตัว invariant เขียนเองว่ากฎนี้บังคับได้เฉพาะฝั่งผู้ผลิต
    resolved_by: >-
      agent-platform#77 — event/v1 v1.8.0 พกกฎเข้า guarantees พร้อมประกาศ
      transition.reason เป็น leaf แรกที่ถือข้อความของคน (ADR-0034)
      · ทำเกินที่เราขอ: เราขอแค่ให้พก invariant มา
    status: resolved   # ปิดที่ต้นทาง 2026-09-20 · ถอด waiver ออกพร้อม bump pin
    note: >-
      เช็คของเราเป็นคนบอกให้ถอด — กฎ "พกมาแล้วแต่ยังมี not_carried_yet ค้างอยู่ → แดง"
      ฟ้องทันทีที่ bump pin · ไม่ต้องมีใครจำว่าต้องกลับมาเก็บ

  - id: approval-subject-type-has-no-record
    issue: https://github.com/monthop-gmail/agent-platform/issues/73   # เปิด 2026-09-18
    detail: >-
      approval/v1 $.subject.type เป็นชุดปิดห้าค่า — job · execution · tool_call ·
      artifact · deployment · ทั้งหมดเป็นของเครื่องจักรที่รัน agent ไม่มีค่าสำหรับ
      บันทึกของโดเมน ซึ่งเป็นสิ่งที่ consumer ในโดเมนธุรกิจขออนุมัติบ่อยที่สุด
    found_by: >-
      care-agent-platform ตอน implement PDPA erasure ที่ต้องมีคนอนุมัติสองคน
      · เขาเลือก artifact ให้คำสั่งหมอที่รอมีผล และ tool_call ให้คำขอลบข้อมูล
      — ทั้งคู่ validate ผ่าน และ audit event ของวัตถุเดียวกันใช้ subject_type record อยู่แล้ว
