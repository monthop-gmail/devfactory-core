not_derived:

  job_state_machine:
    source:
      - rfcs/0001-job-state-machine.md
      - rfcs/0007-job-lifecycle-completeness.md   # amend 0001
      - rfcs/0010-failable-states.md              # ระบุว่า state ไหนไป FAILED ได้
      - rfcs/0011-require-changes-destination.md  # เพิ่ม edge GOVERNANCE_ANALYSIS → DRAFT
    note: >-
      ให้ vocabulary ไว้เพื่อให้ execution/v1 อ้างความหมายของ job state ได้
      โดยไม่ต้องคาดเดา — คำเตือน external-authority-pending ใน execution.schema.yaml
      ที่ field job_id เอาออกได้แล้ว
    states:
      - DRAFT
      - GOVERNANCE_ANALYSIS
      - APPROVED
      - REJECTED
      - TASK_PLANNING
      - IN_PROGRESS
      - AWAITING_APPROVAL
      - VALIDATING
      - DEPLOYABLE
      - COMPLETED
      - FAILED
      - CANCELLED
      - TIMED_OUT
    terminal: [COMPLETED, FAILED, CANCELLED, TIMED_OUT]

    # เส้นทางปกติ — ไม่รวมทางออกที่ตัดขวางทุก state (cancellable/timeoutable/failable ด้านล่าง)
    # ไม่ลง state ที่อยู่ใน terminal เพราะไม่มี edge ออก — ดู terminal ด้านบน
    progression:
      DRAFT: [GOVERNANCE_ANALYSIS]
      # rfcs/0011 เพิ่ม DRAFT — ประตูมีสามคำตัดสิน จึงมีทางออกสามทาง ทางละคำตัดสิน
      # GOVERNANCE_ANALYSIS → DRAFT คือ REQUIRE_CHANGES · ไม่ผ่าน REJECTED โดยเจตนา
      GOVERNANCE_ANALYSIS: [APPROVED, REJECTED, DRAFT]
      APPROVED: [TASK_PLANNING]
      REJECTED: [DRAFT]
      TASK_PLANNING: [IN_PROGRESS]
      IN_PROGRESS: [VALIDATING, AWAITING_APPROVAL]
      VALIDATING: [DEPLOYABLE, AWAITING_APPROVAL]
      DEPLOYABLE: [COMPLETED, AWAITING_APPROVAL]
      AWAITING_APPROVAL: []   # ทางออกเป็น awaiting_from — ดูด้านล่าง ไม่ใช่ dead end

    # ทางออกของ AWAITING_APPROVAL เป็นกฎ ไม่ใช่ edge — ค่าต่างกันต่อ job จึงเขียนเป็นตารางไม่ได้
    awaiting_from: >-
      job ที่เข้า AWAITING_APPROVAL ต้องพก awaiting_from เสมอ (RFC-0007) และออกกลับไปที่ state นั้น
      consumer ที่เห็น progression.AWAITING_APPROVAL = [] ต้องไม่สรุปว่าเป็น terminal

    # rfcs/0010 — FAILED ไปถึงได้จาก 5 state ที่มีงานให้ล้มเท่านั้น
    # ก่อน APPROVED ยังไม่มี execution ผลลัพธ์ที่ซื่อสัตย์คือ REJECTED / CANCELLED / TIMED_OUT
    failable: [TASK_PLANNING, IN_PROGRESS, AWAITING_APPROVAL, VALIDATING, DEPLOYABLE]

    # rfcs/0007 · APPROVED เพิ่มโดย Amendment 1 ของ rfcs/0007 (2026-08-19, issue #17)
    # เหตุผลเป็น governance ไม่ใช่ liveness: การอนุมัติต้องมีวันหมดอายุ
    # job ที่ค้างใน APPROVED ได้ตลอดไป = เริ่มทำงานอีกสัปดาห์ภายใต้คำตัดสินที่บริบทเปลี่ยนไปแล้ว
    # ซึ่งเป็น stale APPROVED แบบเดียวกับที่ rfcs/0007 Decision 1 ห้ามตอนไม่ยอมปลุก job ที่ FAILED
    timeoutable: [GOVERNANCE_ANALYSIS, APPROVED, TASK_PLANNING, IN_PROGRESS, AWAITING_APPROVAL,
                  VALIDATING]

    # rfcs/0007 — หยุดงานได้ทุกจุดก่อนที่มันจะ settle (= states ทั้งหมด ลบ terminal)
    # เขียนเป็น list เหมือน failable/timeoutable เพื่อให้เครื่องที่อ่านสามคีย์นี้ parse ได้แบบเดียวกัน
    cancellable: [DRAFT, GOVERNANCE_ANALYSIS, APPROVED, REJECTED, TASK_PLANNING, IN_PROGRESS,
                  AWAITING_APPROVAL, VALIDATING, DEPLOYABLE]

    # rfcs/0007 Amendment 2 (2026-08-20, issue #21) — job ที่ job ใหม่อ้างถึงด้วย
    # supersedes_job_id ได้ = terminal ที่จบโดย "ไม่ได้ส่งมอบงาน" (= terminal ทั้งหมด ลบ COMPLETED)
    # เดิมจำกัดไว้ที่ FAILED เท่านั้น ทั้งที่เจตนาของ Decision 1 คือสายโซ่ของความพยายามที่ตรวจสอบได้
    # — job ที่หมดเวลาหรือถูกสั่งหยุดก็เป็นความพยายามที่ใช้ไปแล้วเหมือนกัน
    # APPROVED ที่ approval หมดอายุจบที่ TIMED_OUT (Amendment 1) และเข้า FAILED ไม่ได้ (rfcs/0010)
    # การ "ขอใหม่" ตาม approval/v1 จึงไม่มีทางลิงก์กลับเลยก่อนหน้านี้
    # COMPLETED อ้างไม่ได้ — งานที่ส่งมอบแล้วไม่ใช่ความพยายามที่รอความพยายามถัดไป
    # งานที่ต่อยอดจากมันคืองานใหม่ ไม่ใช่การลองใหม่ ต้องใช้ field คนละตัวที่ยังไม่มี
    # ไม่แตะตาราง transition · terminal ยังคง terminal · ไม่มีการปลุก job เดิม
    supersedable: [FAILED, CANCELLED, TIMED_OUT]

    invariants:
      - execution ห้ามเกิดก่อน APPROVED
      - REJECTED ไม่ terminal — กลับไป DRAFT ได้
      - FAILED terminal ที่ระดับ job · retry อยู่ที่ระดับ execution เท่านั้น
      - recovery ของ job ที่จบแล้ว = job ใหม่ที่มี supersedes_job_id ไม่ใช่ปลุกตัวเดิม · job ที่อ้างถึงได้คือ terminal ที่ไม่ได้ส่งมอบงาน (ดู supersedable) · COMPLETED อ้างไม่ได้ (rfcs/0007 Amendment 2)
      - job ไม่เข้า FAILED เพราะ execution เดียวล้ม — orchestration ต้อง exhaust retry ก่อน
      - AWAITING_APPROVAL คนละอย่างกับ GOVERNANCE_ANALYSIS — อันหลังคือประตูก่อนเริ่มงาน
      - FAILED · CANCELLED · TIMED_OUT ต้องมี reason metadata
      - job ที่ยังไม่ผ่าน APPROVED เข้า FAILED ไม่ได้ — ยังไม่มีงานให้ล้ม ผลลัพธ์ที่ซื่อสัตย์คือ REJECTED / CANCELLED / TIMED_OUT (rfcs/0010)
      - approval ที่เลย expires_at แล้วใช้เดินงานต่อไม่ได้ — engine ปฏิเสธ ไม่ใช่ปล่อยผ่าน · job ที่ค้างอยู่เข้า TIMED_OUT ได้ (rfcs/0007 Amendment 1)
      - REQUIRE_CHANGES กับ REJECT จบที่ DRAFT เหมือนกันแต่คนละเส้นทาง — REJECT ผ่าน REJECTED ส่วน REQUIRE_CHANGES ข้าม · แยกกันที่ trail ไม่ใช่แค่ที่ decision record (rfcs/0011)
      - คำถามว่า transition นี้เป็นคำตัดสินไหม ต้องอ่านที่ edge ไม่ใช่ที่ปลายทาง — REJECTED → DRAFT ไม่ใช่คำตัดสิน (rfcs/0011)
    layering: job (ที่นี่) > execution (execution/v1) > step (event/)

  orchestration_execution_boundary:
    source:
      - rfcs/0004-orchestration-execution-boundary.md
    note: ยกไปใช้ได้ทั้งดุ้นโดยไม่ต้องแก้ — ตรงกับ ADR-0005 ฝั่ง agent-platform แล้ว
    forbidden:
      - execution ตัดสิน governance เอง
      - orchestration แก้ artifact โดยตรง

