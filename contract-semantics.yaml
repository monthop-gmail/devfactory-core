# Semantics manifest — สิ่งที่ devfactory-core เป็นเจ้าของและ agent-platform ห้ามเปลี่ยนเอง
#
# ทำไมมีไฟล์นี้:
#   rfcs/0005 แยก authority เป็น semantics (repo นี้) กับ wire schema (agent-platform)
#   ไฟล์นี้คือครึ่ง semantics ในรูปที่เครื่องอ่านได้ เพื่อให้ agent-platform
#   ไม่ต้องอ่าน prose 4 ไฟล์แล้วตีความเองว่าอะไรแตะได้อะไรแตะไม่ได้
#
# ⚠️ ไฟล์นี้ไม่ใช่ schema และห้ามใช้เป็น schema
#   ไม่มี field type · ไม่มีโครงสร้าง · ไม่มี validation
#   rfcs/0005 Rule 4 ห้าม repo นี้มี schema ขนานกับของ agent-platform
#   ที่นี่มีแค่ vocabulary · guarantee · invariant — ส่วนรูปร่างบน wire เป็นของ agent-platform
#
# ที่มาฉบับเต็มเป็น prose อยู่ใน rfcs/ — ถ้าไฟล์นี้ขัดกับ RFC ให้ถือ RFC เป็นหลัก
# แล้วเปิด issue เพราะแปลว่าไฟล์นี้ผิด

semantics_version: "1.4"
owner: devfactory-core
authority: rfcs/0005-platform-contract-authority.md
amended_by: rfcs/0009-vocabulary-extension.md   # Rule 2 — เพิ่ม event type เป็น additive แล้ว
license: MIT

# 1.3 → 1.4 (2026-09-18)
#   ประกาศ approval.frozen.subject_types ที่ไม่เคยถูกเขียนไว้ที่ไหน + เพิ่มค่า record
#   และเพิ่ม subject ลง required_meaning (rfcs/0016)
#   contract ที่ derive ต้องอัปเดต derived_from.semantics_version เป็น "1.4"
#
# 1.2 → 1.3 (2026-09-17)
#   เพิ่ม invariant: leaf ที่อาจถือข้อความของคนต้องประกาศ ที่เหลือเป็นตัวชี้ (rfcs/0013)
#   contract ที่ derive ต้องอัปเดต derived_from.semantics_version เป็น "1.3"
#
# 1.1 → 1.2 (2026-08-21)
#   เพิ่ม guarantee: ทุกการจบแบบ terminal ต้องออกใบปิดท้าย (rfcs/0012)
#   contract ที่ derive ต้องอัปเดต derived_from.semantics_version เป็น "1.2"
#
# 1.0 → 1.1 (2026-08-18)
#   event_types เปลี่ยนจาก "ชุดปิด" เป็น "ขั้นต่ำที่ต้องมี" — agent-platform เพิ่มเองได้
#   contract ที่ derive ต้องอัปเดต derived_from.semantics_version เป็น "1.1"

# ─────────────────────────────────────────────────────────────
# วิธีตรวจ drift
# ─────────────────────────────────────────────────────────────
# ห้าม pin commit SHA ของไฟล์ RFC เพื่อตรวจ drift — RFC เป็น prose
# การแก้คำผิดจะทำให้ SHA เปลี่ยนและปลุก alarm โดยไม่มีอะไร drift จริง
# ส่วนการเปลี่ยน enum ที่ frozen ก็ทำให้ SHA เปลี่ยนเท่ากัน แยกกันไม่ออก
#
# ให้ pin `semantics_version` ของไฟล์นี้แทน:
#   - แก้ prose / เพิ่มคำอธิบาย / จัดรูปแบบ  → version ไม่ขยับ
#   - แตะอะไรใน `frozen:` ก็ตาม             → version ขยับและต้องมี RFC ก่อน (Rule 2)
#
# "ขยับ" คือขยับหลักหลัง — 1.1 · 1.2 · 1.3 · 1.4 ล้วนเป็นการแตะ `frozen:` ทั้งสิ้น
# บรรทัดนี้เคยเขียนว่า "ขยับ major" ซึ่งไม่ตรงกับที่ทำจริงมาสี่รอบ · แก้ถ้อยคำให้ตรง
# กับการปฏิบัติ ไม่ใช่แก้การปฏิบัติให้ตรงถ้อยคำ — ไม่มี consumer รายไหนอ่านคำว่า
# major แล้วทำอะไรต่างออกไป และ major bump จริงจะหมายถึงการถอนหรือลดทอน guarantee
# ซึ่งยังไม่เคยเกิด (rfcs/0016 Open Questions)
#
# ถ้าอยาก check อัตโนมัติใน CI ให้ hash เฉพาะ subtree `frozen:` ของแต่ละ contract
# แล้วเทียบกับค่าที่บันทึกไว้ — hash เปลี่ยนโดย version ไม่ขยับ = เราทำผิดกฎ ให้ fail ได้เลย

drift_check:
  pin: semantics_version
  do_not_pin: commit SHA ของไฟล์ RFC
  hash_scope: frozen   # subtree ที่ควร hash ถ้าจะ check อัตโนมัติ

# ─────────────────────────────────────────────────────────────
# บล็อกที่ agent-platform ก๊อปไปใส่ contracts/<name>/ ได้เลย
# ─────────────────────────────────────────────────────────────
# rfcs/0005 Rule 3 บังคับว่า contract ที่ derive มาต้องบอกที่มา
# เราเป็นคนตั้งกฎนี้ จึงให้รูปแบบมาด้วย ไม่ปล่อยให้ออกแบบเอง

derived_from_block_template: |
  # ใส่ใน contracts/approval/ และ contracts/event/
  derived_from:
    repo: monthop-gmail/devfactory-core
    manifest: contract-semantics.yaml
    semantics_version: "1.4"
    rfcs:
      - rfcs/0002-governance-decision-contract.md
    license: MIT
    # ตรวจ drift โดยเทียบ semantics_version ไม่ใช่ SHA ของไฟล์ RFC

# ─────────────────────────────────────────────────────────────
# contract ที่ derive จาก repo นี้ — semantics เป็นของเรา schema เป็นของ agent-platform
# ─────────────────────────────────────────────────────────────

contracts:

  approval:
    status: unblocked          # rfcs/0005 ปิดเรื่อง authority แล้ว เขียน schema ได้
    source:
      - rfcs/0002-governance-decision-contract.md

    frozen:
      # เปลี่ยนอะไรในบล็อกนี้ต้องมี RFC ที่ repo นี้ก่อน
      decision_types:
        # ⚠️ ชุดปิด — เพิ่มค่าใหม่ก็ยังเป็น semantic change (rfcs/0009)
        # ต่างจาก event_types โดยเจตนา: การเพิ่ม outcome ของการอนุมัติ
        # เปิดทางให้ execution เดินได้โดยไม่มี APPROVE ของคนได้ (เช่น AUTO_APPROVE)
        # ส่วนการเพิ่ม event type เป็นแค่การเพิ่มสิ่งที่สังเกต ไม่ลดทอน guarantee ใด
        closed: true
        values:
          - APPROVE
          - REJECT
          - REQUIRE_CHANGES

      required_meaning:
        # "ความหมายที่ต้องมี" ไม่ใช่ชื่อ field — ชื่อกับ type เป็นของ agent-platform
        - คำตัดสิน (decision)
        - เหตุผลที่ตัดสินอย่างนั้น (reason)
        - ผู้มีอำนาจที่รับผิดชอบคำตัดสินนี้ (authority)
        - เวลาที่ตัดสิน (timestamp)
        # rfcs/0016 — ข้อนี้หายไปตั้งแต่ต้น ทั้งที่ approval/v1 มี subject ใน required
        # และนั่นคือวิธีที่ชุดค่าของมันหลุดไปไม่ถูกประกาศ: ความหมายที่มันรับใช้
        # ก็ไม่เคยถูกลิสต์เหมือนกัน
        - เกี่ยวกับอะไร (subject) — คำตัดสินที่ไม่บอกว่าตัดสินเรื่องอะไร ตามรอยไม่ได้

      subject_types:
        # rfcs/0016 · ชุดนี้เป็น semantics ของเรา — approval/v1 เขียนกำกับเองว่า
        # "🔒 เป็น semantics ของ devfactory-core" และ platform_may_add_freely ของ
        # approval ก็ไม่มี subject · แต่เราไม่เคยประกาศมันไว้ที่ไหน จึงไม่มีอะไรฝั่งนี้
        # มองเห็นได้เลยว่ามันขาดค่า จนกระทั่ง care-agent-platform ชนมันสองครั้ง
        #
        # ⚠️ ต่างจาก event/v1 โดยเจตนา — subject_type ของ event อยู่ใน
        # platform_may_add_freely คือ enum เป็นของ agent-platform (ดู contracts.event)
        # ชื่อ field เดียวกัน เจ้าของคนละคน · เขียนไว้ตรงนี้เพราะเดิมไม่มีเอกสารไหนบอก
        closed: false
        # เปิด ไม่ใช่ปิด ตามบททดสอบของ rfcs/0009: การเพิ่มค่าเปิดทางให้ execution
        # เดินโดยไม่มี APPROVE ของคนไหม · subject type บอกว่าอนุมัติ "อะไร"
        # ไม่เคยบอกว่า "อนุมัติหรือไม่" — ต่างจาก decision_types ที่ปิดด้วยเหตุนั้น
        required_minimum:
          - job
          - execution
          - tool_call
          - artifact
          - deployment
          - record
        record_means: >-
          ยืมนิยามจาก event/v1 ทั้งดุ้น ไม่เขียนใหม่ — การที่สองสัญญาเรียกของเดียวกัน
          คนละชื่อคือสิ่งที่ rfcs/0016 กำลังแก้ นิยามที่สองจะพามันกลับมา
          · "บันทึกของโดเมนที่ระบบเก็บไว้และต้องตามรอยได้ แต่ไม่ได้เกิดจาก job
          · ชนิดที่แท้จริงอยู่ใน metadata.record_type — platform ไม่รู้จักชนิดของโดเมน
          และไม่ควรรู้ · แยกจาก artifact ซึ่งเป็นผลผลิตของ execution"
        evidence: >-
          agent-platform#73 — care-agent-platform เลือก artifact ให้คำสั่งหมอที่รอมีผล
          และ tool_call ให้คำขอลบข้อมูล · ทั้งคู่ validate ผ่าน และ audit event
          ของวัตถุเดียวกันใช้ subject_type record อยู่แล้ว

      guarantees:
        - decision เป็น immutable — แก้ไม่ได้หลังบันทึก
        - ทุก APPROVE ต้อง auditable
        - execution ที่ไม่มี APPROVE เป็นสิ่งที่ห้าม

      invariants:
        - approval ไม่ใช่ policy — policy ตอบว่า "ต้องขออนุมัติไหม" · approval คือคำตัดสินของผู้มีอำนาจ
        - decision ต้องอยู่ tenant เดียวกับสิ่งที่มันอนุมัติ · ต่าง tenant = invalid ให้ reject ไม่ใช่ coerce (rfcs/0006)
        - agent ออก APPROVE ให้งานของตัวเองไม่ได้ — "no agent has total authority"
        - REQUIRE_CHANGES ไม่ใช่ REJECT — งานยังมีชีวิตและกลับมายื่นใหม่ได้

    # ℹ️ ไม่ใช่ส่วนหนึ่งของ contract — บอกสถานะฝั่ง implementation เฉย ๆ
    # อยู่นอก frozen: จึงไม่ขยับ semantics_version และไม่กระทบ drift_check
    implementation_status:
      note: >-
        packages/core ทำ decision interface ครบตาม RFC-0002 แล้ว (issue #5)
        vocabulary ยังมีครบ 3 ค่าตามชุดปิด — ห้ามลบค่าใดออกจาก contract
        · ตั้งแต่ rfcs/0011 ทั้งสามค่ามีปลายทางแล้ว engine ไม่ปฏิเสธค่าใดอีก
      enforced_optional_fields:
        # field ที่ agent-platform เพิ่มเองได้ (platform_may_add_freely ด้านล่าง)
        # แต่ตัว schema เขียนความหมายไว้แล้ว — repo นี้จึงบังคับตามความหมายนั้น
        # ไม่ใช่การเพิ่ม guarantee ใหม่ แต่คือการปิดช่องว่างของการ conform
        - field: expires_at
          detail: >-
            approval/v1 บอกว่า "approval ที่หมดอายุแล้วใช้เดินงานไม่ได้ ต้องขอใหม่ ·
            งานที่ค้างรออนุมัติจนเลยกำหนดควรเข้าสถานะ timeout ไม่ใช่รอตลอดไป"
            · Decision เก็บค่านี้ · engine ปฏิเสธการเข้า state ฝั่ง execution
            ด้วย approval ที่หมดอายุ (ExpiredApproval) · replay ปฏิเสธ trail ที่บันทึกว่าเกิดขึ้นแล้ว
            (ExecutionAfterExpiry) · ปลายทางของงานที่ค้างคือ TIMED_OUT ตาม rfcs/0007 Amendment 1
          optional: >-
            ยัง optional เหมือนใน schema — approval ที่ไม่มี expires_at คือไม่มีวันหมดอายุ
            บังคับให้ต้องมีจะทำให้ engine เข้มกว่า contract ที่ conform อยู่ · issue #17
      decision_targets:
        # ครบทั้งสามค่าแล้วตั้งแต่ rfcs/0011 — เดิม REQUIRE_CHANGES ไม่มีปลายทาง
        # และ engine ปฏิเสธด้วย UnmappedDecision
        APPROVE: APPROVED
        REJECT: REJECTED
        REQUIRE_CHANGES: DRAFT
      require_changes:
        detail: >-
          rfcs/0011 กำหนดให้ REQUIRE_CHANGES พา job กลับไป DRAFT ผ่าน edge ใหม่
          GOVERNANCE_ANALYSIS → DRAFT · ไม่เพิ่ม state และไม่เพิ่มค่าใน vocabulary
          · approval ถูกล้างเหมือน REJECT เพราะการถูกสั่งให้แก้ไม่ใช่การได้รับอนุมัติ
        how_it_stays_distinct_from_reject: >-
          ปลายทางเดียวกันแต่คนละเส้นทาง และเส้นทางอยู่ใน trail จริง:
          REJECT เดิน GOVERNANCE_ANALYSIS → REJECTED → DRAFT (state REJECTED ค้างใน
          history ตลอดไป) ส่วน REQUIRE_CHANGES เดิน GOVERNANCE_ANALYSIS → DRAFT ตรง ๆ
          ข้าม REJECTED · คนที่อ่านย้อนจาก log อย่างเดียวจึงแยกออกได้ ไม่ต้องเชื่อ
          decision record อย่างเดียว · invariant "REQUIRE_CHANGES ไม่ใช่ REJECT"
          จึงถูกบังคับด้วยรูปร่างของ trail ไม่ใช่ด้วยคำอธิบาย
        note_for_consumers: >-
          ผลที่ตามมา: "transition นี้เป็นคำตัดสินหรือไม่" ต้องดูที่ edge ไม่ใช่ที่ปลายทาง
          — GOVERNANCE_ANALYSIS → DRAFT เป็นคำตัดสิน ส่วน REJECTED → DRAFT ไม่ใช่
          (เป็นแค่ขั้นแก้ไขหลังคำตัดสินที่บันทึกไปแล้ว) · ดู states.DECISION_BY_EDGE

    # ℹ️ นอก frozen — rfcs/0016 ขั้น 3 · เทียบสิ่งที่เรา freeze กับสัญญาที่ pin ไว้
    carried_check:
      target: approval/v1
      schema: approval/v1/approval.schema.yaml
      covers: [subject_types, required_meaning]
      not_covered_yet: >-
        guarantees · invariants · decision_types ของ approval ยังไม่ถูกเทียบ
        · เขียนไว้ตรงนี้แทนที่จะปล่อยให้ดูเหมือนตรวจครบ — ของ event ใช้เวลาหนึ่งวัน
        กว่าจะรู้ว่ามีข้อที่ไม่ได้ถูกพกมา เพราะไม่มีใครเทียบ ไม่ใช่เพราะเทียบแล้วผ่าน
        · ทำต่อได้ทันทีที่มีคนลงมือ ไม่มีอะไรบล็อก
      markers:
        - anchor: คำตัดสิน (decision)
          carried_as: decision
          as_key: true
        - anchor: เหตุผลที่ตัดสินอย่างนั้น (reason)
          carried_as: reason
          as_key: true
        - anchor: ผู้มีอำนาจที่รับผิดชอบคำตัดสินนี้ (authority)
          carried_as: authority
          as_key: true
        - anchor: เวลาที่ตัดสิน (timestamp)
          carried_as: decided_at
          as_key: true
          note: >-
            ชื่อ field เป็นของ agent-platform ตาม rfcs/0005 Rule 1 — ใบเราประกาศ
            "ความหมายที่ต้องมี" ไม่ใช่ชื่อ · ที่เทียบคือความหมายมาถึงหรือเปล่า
        - anchor: เกี่ยวกับอะไร (subject)
          carried_as: subject
          as_key: true
          note: >-
            approval/v1 มี subject ใน required อยู่แล้ว — ความหมายมาถึงก่อนที่ใบเรา
            จะลิสต์มัน ซึ่งเป็นลำดับที่กลับหัวและเป็นเหตุให้ชุดค่าของมันหลุดไป
        - anchor: job
          carried_as: job
          in_enum: true
        - anchor: execution
          carried_as: execution
          in_enum: true
        - anchor: tool_call
          carried_as: tool_call
          in_enum: true
        - anchor: artifact
          carried_as: artifact
          in_enum: true
        - anchor: deployment
          carried_as: deployment
          in_enum: true
        - anchor: record
          carried_as: record
          in_enum: true
          not_carried_yet:
            since: "2026-09-18"
            detail: >-
              approval/v1 ที่ commit a5138dfe มี enum [job, execution, tool_call,
              artifact, deployment] — ไม่มี record · consumer ที่ต้องอนุมัติบันทึก
              ของโดเมนจึงต้องเลือกค่าที่ผิดน้อยที่สุด และเลือกไม่ตรงกันสองที่ในโดเมนเดียว
            owner: agent-platform
            why_theirs: rfcs/0005 Rule 1 — ถ้อยคำและโครงสร้างของสัญญาเป็นของเขา
            issue: https://github.com/monthop-gmail/agent-platform/issues/73
            expires: "2026-11-18"
            expires_reason: >-
              สองเดือนนับจากวันประกาศ semantics 1.4 — ยาวกว่าใบของ rfcs/0013
              เพราะใบนี้เพิ่งยื่นวันนี้และยังไม่มี ADR ฝั่งเขารองรับ ต่างจากกรณีนั้น
              ที่เขาลงมือก่อนเราจะรายงานด้วยซ้ำ

    platform_may_add_freely:
      # เพิ่มได้ผ่าน ADR ฝั่ง agent-platform อย่างเดียว ไม่ต้องมี RFC ที่นี่ (Rule 1)
      # ปิดประเด็น §4.6 ของ consumer-devfactory-core.md — rfcs/0002 ไม่ได้ "ขาด" field เหล่านี้
      # มันเงียบเรื่องนี้โดยเจตนา เพราะเป็นเรื่องระดับ platform ไม่ใช่ระดับความหมาย
      - tenant_id
      - workspace_id
      - execution_id
      - agent_id
      - policy_id
      - expires_at
      - action_risk
      - escalation_target
      - อื่น ๆ ที่ไม่เปลี่ยนความหมายของคำตัดสิน

  event:
    status: unblocked
    source:
      - rfcs/0003-audit-event-log-schema.md
      - rfcs/0008-external-event-intake.md     # amend 0003
      - rfcs/0012-terminal-closing-record.md   # เพิ่ม guarantee ใบปิดท้าย

    # ℹ️ ไม่ใช่ส่วนหนึ่งของ contract — อยู่นอก frozen: จึงไม่ขยับ semantics_version
    # guarantee ข้างล่างพูดถึง "ใบปิดท้าย" โดยไม่ระบุชื่อ type โดยเจตนา:
    # guarantee เป็นของ repo นี้ ส่วน vocabulary เพิ่มได้เองฝั่ง agent-platform (rfcs/0009)
    implementation_status:
      closing_record_type: JOB_SETTLED
      note: >-
        packages/core emit JOB_SETTLED เป็นใบสุดท้ายทุกครั้งที่ job เข้า terminal
        · COMPLETED ออกทั้ง JOB_COMPLETED และ JOB_SETTLED เพราะสองใบตอบคนละคำถาม
        และกฎที่ไม่มีข้อยกเว้นคือสิ่งที่ทำให้ตรวจได้
        · พก metadata.settled_as และ metadata.event_count (นับตาม job_id รวมใบปิดเอง)
        · payload validate ผ่านอยู่แล้วเพราะ field event_type อ้าง EventTypeName ชุดเปิด
        — การเพิ่ม JOB_SETTLED เข้า $defs.EventType เป็น additive ฝั่ง agent-platform
        ทำเมื่อไหร่ก็ได้ ไม่มีอะไรรอมัน

    frozen:
      event_types:
        # ✅ ชุดเปิด — 7 ตัวนี้คือ "ขั้นต่ำที่ต้องมี" ไม่ใช่ชุดทั้งหมด (rfcs/0009)
        # agent-platform เพิ่ม event type ใหม่ได้เองผ่าน ADR ฝั่งนั้น ไม่ต้องมี RFC ที่นี่
        # แต่ ลบ · เปลี่ยนชื่อ · เปลี่ยนความหมาย ของ 7 ตัวนี้ ยังเป็น semantic change
        closed: false
        required_minimum:
          - JOB_CREATED
          - STATE_TRANSITION
          - GOVERNANCE_DECISION
          - TASK_ASSIGNED
          - EXECUTION_STARTED
          - EXECUTION_FAILED
          - JOB_COMPLETED

      guarantees:
        - event เป็น append-only
        - no silent state change — ทุกการเปลี่ยน state ต้องมี event
        # rfcs/0012 — ปิดช่องที่ agent-platform#23 ยกมา: trail ที่ถูกตัดท้ายอ่านได้
        # เหมือน trail ที่สมบูรณ์ เพราะไม่มีอะไรยืนยันใบสุดท้าย
        - ทุกการจบแบบ terminal ต้องออกใบปิดท้าย — ไม่ใช่แค่ทางที่จบสำเร็จ

      invariants:
        - ทุก event ต้องตอบได้ว่า "เกี่ยวกับอะไร" — subject จำเป็นเสมอ ส่วน job_id optional
        - ห้ามสร้าง job_id ปลอมหรือ default ให้ event ที่ไม่มี job · ไม่มีคือไม่มี
        - event ที่ resolve tenant ไม่ได้ ให้ reject ที่ intake ห้ามเดา tenant ให้
        - event ที่ devfactory-core ส่งออกต้องมี job_id เสมอ — optional ใน schema ไม่ใช่ optional ในพฤติกรรม
        - external event ต้องคง source ไว้ให้รู้ตลอดไปว่ามาจากข้างนอก
        - ห้ามเก็บ private reasoning / chain-of-thought เป็น audit record — เก็บ structured metadata แทน
        - trace ที่ไม่มี step ย่อยถือว่าถูกต้อง · execution ที่ไม่มี step event ไม่ได้แปลว่ามันไม่ได้ทำอะไร

        # rfcs/0013 — ขอมาโดย agent-platform ตาม Rule 2 พร้อมหลักฐานจาก audit จริง 112 ใบ
        # ของ care-agent-platform · เป็น "ต้องประกาศ" ไม่ใช่ "ห้ามมี" เพราะกฎแบบห้าม
        # จะทำให้ระบบที่บันทึกเหตุผลไว้ถูกต้องกลายเป็น non-conformant แล้วคนจะแก้ด้วยการ
        # ลบเหตุผลทิ้ง ซึ่งทำลายความสามารถของ audit ในการตอบคำถามที่สำคัญที่สุดของโดเมนนั้น
        - >-
          leaf ที่อาจถือข้อความของคนต้องถูกประกาศไว้ในสัญญา ที่เหลือทุก leaf เป็นตัวชี้
          (id · code · ตัวเลข · timestamp · boolean · enum) · 3 ข้อ:
          (1) กฎนี้ใช้ที่ระดับ leaf ไม่ใช่ field ระดับบนสุด — object กับ array เป็นภาชนะ
          ไม่ใช่ค่า ให้ไล่ลงไปจนถึงค่าที่ไม่มีลูก
          (2) leaf ที่อาจถือข้อความของคนต้องประกาศ
          (3) leaf ที่ประกาศแล้วต้องบอกว่ากฎการเก็บและการลบของมันอยู่ที่ชั้นไหน
          — store ที่เป็น append-only ลบรายฟิลด์ไม่ได้ และต้องบอกว่าทำอะไรแทน
          · บังคับได้เฉพาะฝั่งผู้ผลิต: validator บอกได้ว่ามี key อะไร แต่บอกไม่ได้ว่าใครพิมพ์ค่านั้น

    # ℹ️ การประกาศตาม rfcs/0013 ข้อ 2 และ 3 — อยู่นอก frozen เพราะเป็นของฝั่งเรา
    # ไม่ใช่ส่วนหนึ่งของสัญญา · RFC กำหนดว่าการประกาศต้องเป็นสิ่งที่ checker อ่านจริง
    # conformance/payload_check.py อ่านบล็อกนี้ ไม่ได้ถือรายการของตัวเอง
    text_fields:
      # ℹ️ "ประกาศไว้ในสัญญา" ในข้อ (2) ของ invariant หมายถึงอะไร — นอก frozen
      #
      # ถ้อยคำในข้อนั้นอ่านได้ว่าการประกาศต้องอยู่ "ในสัญญา" ขณะที่บล็อกนี้เองอยู่
      # นอก frozen และเขียนกำกับว่าไม่ใช่ส่วนหนึ่งของสัญญา · care-agent-platform
      # ต้องมานั่งไล่ว่าตัวเองผิดกฎหรือเปล่าก่อนจะสรุปว่าไม่ผิด (care-agent-platform#28)
      #
      # การอ่านที่ตกลงกันแล้วทั้งสองฝั่ง: สิ่งที่ข้อนั้นบังคับคือ **ต้องมีการประกาศ
      # ที่เป็นของจริงและเป็นสิ่งที่ checker ของผู้ผลิตอ่านเอง** ไม่ใช่ว่าการประกาศ
      # ต้องอยู่ในไฟล์สัญญากลาง · ผู้ผลิตแต่ละรายรู้ว่าใครเขียนค่าลง field ของตัวเอง
      # ส่วนสัญญากลางไม่รู้ และ rfcs/0013 เขียนไว้เองว่ากฎนี้บังคับได้ที่ผู้ผลิตเท่านั้น
      #
      # ไม่แก้ถ้อยคำในข้อนั้นเพราะมันอยู่ใน frozen — แก้แล้วต้อง bump major
      # และให้ทุก consumer ตามใหม่ เพื่อเปลี่ยนคำที่ทุกฝ่ายอ่านตรงกันอยู่แล้ว
      declared:
        - leaf: transition.reason
          who_writes_it: คนที่สั่งให้ transition นั้นเกิด
          why_it_cannot_be_a_pointer: >-
            RFC-0001 บังคับให้ FAILED · CANCELLED · TIMED_OUT มี reason metadata
            และไม่มีตารางโดเมนในระบบนี้ที่เก็บประโยคนั้นไว้ให้ชี้ไปหา
          retention_layer: >-
            ลบรายฟิลด์ไม่ได้ — event/v1 เป็น append-only · EventLog ของ repo นี้อยู่ใน
            หน่วยความจำล้วน การลบจึงเกิดตอน process ตายเท่านั้น และยังไม่มีชั้น store
            หรือ tenant ที่ลบได้จริงในระบบนี้วันนี้
        - leaf: metadata.approval.reason
          who_writes_it: ผู้มีอำนาจที่ออกคำตัดสิน
          why_it_cannot_be_a_pointer: >-
            approval/v1 บังคับ reason ให้ minLength 1 — คำตัดสินที่ไม่มีเหตุผลไม่ auditable
          retention_layer: เหมือน transition.reason
      # ทุก leaf ที่เป็น string และไม่อยู่ใน declared ต้องอยู่ที่นี่ — ไม่มีข้อที่สาม
      # leaf ใหม่ที่ไม่อยู่ทั้งสองรายการทำให้ CI แดง ซึ่งเป็นตัว ratchet ตาม rfcs/0013 ข้อ 2:
      # "ก่อน: ใครพิมพ์ลงไปก็ไม่มีใครเห็น · หลัง: ต้องแก้สัญญาก่อน แล้วมีคนรีวิว"
      pointers:
        - actor.id
        - actor.type
        - correlation_id
        - event_id
        - event_type
        - job_id
        - metadata.approval.approval_id
        - metadata.approval.authority.id
        - metadata.approval.authority.type
        - metadata.approval.decided_at
        - metadata.approval.decision
        - metadata.approval.expires_at
        - metadata.approval.subject.id
        - metadata.approval.subject.type
        - metadata.approval.supersedes_approval_id
        - metadata.approval.tenant_id
        - metadata.approval.workspace_id
        - metadata.record_type
        - metadata.settled_as
        - metadata.supersedes_job_id
        - occurred_at
        - source.kind
        - source.system
        - subject_id
        - subject_type
        - tenant_id
        - transition.from
        - transition.to
        - workspace_id
      cutover:
        # rfcs/0013 Migration Plan — เกณฑ์คือ "ตั้งแต่จุดไหนไม่มีใบใหม่ที่ผิดกฎ"
        # ไม่ใช่เปอร์เซ็นต์ที่แต่ละทีมรายงานเองแล้วไม่มีใครตรวจได้
        from: rfcs/0013 · ตัด display_name ออกจากจุด emit
        outstanding_before_it: >-
          ไม่มี — EventLog อยู่ในหน่วยความจำ ไม่มี record ที่เขียนไว้ก่อนหน้าหลงเหลืออยู่จริง
          · ต่างจาก producer ที่มี store ถาวร ซึ่งต้องประกาศว่าเหลืออะไรและทำอะไรกับมัน
      removed_at_cutover:
        - leaf: actor.display_name
          found_in: ทุก event ที่ engine นี้เคยเขียน (8 จาก 8 ในการไล่ leaf ครั้งแรก)
          note: >-
            ตรงกับ 112 จาก 112 ที่ care-agent-platform รายงาน (ADR-0031)
            · display_name เป็น optional ใน identity/v1 มาตั้งแต่ v1.0.0 จึงตัดได้ทันที
            โดยยัง conform ไม่ต้องรอสัญญาเวอร์ชันใหม่
        - leaf: metadata.approval.authority.display_name
          note: เส้นทางที่สองที่ซ้อนอยู่ใน decision record — ตัดจุดเดียวครอบทั้งคู่
        - leaf: actor.on_behalf_of.display_name
          note: >-
            chain ของการมอบอำนาจ — จุดที่การตัดครั้งแรกของ producer อ้างอิงพลาดไป
            เราจึงตัดแบบ recursive ตั้งแต่ต้น

    # ℹ️ นอก frozen — ตรวจว่าสัญญาที่ derive ไปแล้ว "พก" ข้อผูกมัดของเราจริงหรือเปล่า
    #
    # ทำไมต้องมี: rfcs/0005 Rule 2 ให้ semantics เป็นของ repo นี้ และ Rule 3 ให้สัญญา
    # ที่ derive ไปบอกที่มา · แต่ไม่มีอะไรตรวจว่า "บอกที่มา" กับ "พกของที่อ้างถึงมาด้วย"
    # เป็นเรื่องเดียวกัน — drift check เทียบ semantics_version ซึ่งตรง · payload_check
    # เทียบ payload กับ schema ซึ่งผ่าน · pin_freshness เทียบอายุ ซึ่งสด
    #
    # ช่องนี้ถูกพบเมื่อ 2026-09-18 โดย care-agent-platform ไม่ใช่โดยเช็คของเรา
    # (care-agent-platform#28) — เป็นรูปเดียวกับที่ ADR-0006 ตั้งชื่อไว้ว่า
    # "declared is not conforming" แค่กลับด้าน: คราวนี้สัญญาเป็นฝ่ายประกาศว่า
    # ตามเราแล้ว โดยยังไม่ได้พกกฎมา
    carried_check:
      note: >-
        conformance/payload_check.py อ่านบล็อกนี้ · ทุกข้อใน frozen ต้องมีรายการที่นี่
        และรายการที่ anchor ชี้ไปไม่ตรงกับข้อไหนเลยถือว่าผิด — สัญญาที่โตเกินกว่าที่ตรวจ
        ต้องแดง ไม่ใช่ผ่านเงียบ ๆ ทับของเดิม
      target: event/v1
      schema: event/v1/event.schema.yaml
      covers: [guarantees, invariants]
      not_covered_yet: >-
        event_types ไม่ถูกเทียบที่นี่โดยเจตนา — ใบเราเขียนไว้เองว่า enum และชื่อ field
        ของ subject_type/event_type เป็นของ agent-platform (platform_may_add_freely)
        · การเทียบมันจะเป็นการตรวจของที่เราไม่ได้เป็นเจ้าของ
      markers:
        - anchor: event เป็น append-only
          carried_as: append-only
        - anchor: no silent state change
          carried_as: no silent state change
        - anchor: ทุกการจบแบบ terminal
          carried_as: JOB_SETTLED
          note: >-
            พกมาเป็นค่าใน vocabulary พร้อมคำอธิบายว่าต่างจาก JOB_COMPLETED อย่างไร
            ไม่ได้พกมาเป็นข้อใน guarantees.rules · ยอมรับได้เพราะผู้อ่านสัญญาเห็นของจริง
        - anchor: ทุก event ต้องตอบได้ว่า
          carried_as: subject จำเป็นเสมอ
        - anchor: ห้ามสร้าง job_id ปลอม
          carried_as: ห้ามสร้าง job_id ปลอม
        - anchor: event ที่ resolve tenant ไม่ได้
          carried_as: ห้ามเดา tenant
        - anchor: event ที่ devfactory-core ส่งออก
          ours_only: >-
            ข้อนี้เป็นคำสัญญาของ producer รายนี้ ไม่ใช่กฎของสัญญากลาง — การใส่ลงไป
            จะกลายเป็นการบังคับผู้ผลิตรายอื่นให้ทำตามกฎที่ว่าด้วย devfactory-core
            · เราบังคับมันเองที่ conformance/payload_check.py
        - anchor: external event ต้องคง source
          carried_as: คง source
        - anchor: ห้ามเก็บ private reasoning
          carried_as: private reasoning
        - anchor: trace ที่ไม่มี step ย่อย
          carried_as: trace ที่ไม่มี step
        - anchor: leaf ที่อาจถือข้อความของคน
          carried_as: leaf
          not_carried_yet:
            since: "2026-09-17"
            detail: >-
              event/v1 v1.7.1 ที่ commit a5138dfe ประกาศ semantics_version "1.3"
              และใส่ rfcs/0013 ไว้ใน derived_from.rfcs แล้ว แต่ทั้งเอกสารไม่มีคำว่า
              leaf · ไม่มีข้อใน guarantees.rules · ไม่มีใน platform_rules
              — อ้างถึงแล้ว แต่ยังไม่ได้พกมา
            owner: agent-platform
            why_theirs: rfcs/0005 Rule 1 — ถ้อยคำและโครงสร้างของสัญญาเป็นของเขา
            issue: https://github.com/monthop-gmail/agent-platform/issues/74
            expires: "2026-10-31"
            expires_reason: >-
              วันเดียวกับ backstop ของ issue #32 ไม่ใช่การประเมินว่างานใช้เวลาเท่านั้น
              · เลื่อนได้ถ้าเขาขอ แต่ต้องเขียนเหตุผลลงตรงนี้ ไม่ใช่ขยับตัวเลขเฉย ๆ
            acceptable_answer: >-
              "ไม่ควรพกมา" เป็นคำตอบที่ถูกได้จริง — ตัวใบเขียนเองว่ากฎนี้บังคับได้
              เฉพาะฝั่งผู้ผลิต · ถ้าเขาตอบแบบนั้นพร้อมเหตุผล รายการนี้เปลี่ยนเป็น
              ours_only เหมือนข้อ job_id ไม่ใช่ค้างเป็นช่องว่างต่อไป

    # ℹ️ rfcs/0015 — ข้อความใน external event เป็นของผู้ผลิต ไม่ใช่ของเรา
    # อยู่นอก frozen เพราะเป็นการประกาศฝั่งเรา ไม่ใช่ส่วนหนึ่งของสัญญา
    # conformance/payload_check.py อ่านบล็อกนี้ ไม่ได้ถือรายการของตัวเอง
    external_text:
      rule: >-
        record ที่มาจากข้างนอก (source.kind = external) ให้ตรวจที่ระดับ "ผู้ผลิต"
        ไม่ใช่ระดับ field · leaf ใต้ metadata ของใบนั้นเป็นเนื้อหาใต้สัญญาของ repo อื่น
        และสิ่งที่เราพูดได้จริงคือ "ของใคร" ไม่ใช่ "ถืออะไร"
        · leaf ที่อยู่นอก metadata ยังต้องเป็นตัวชี้หรือถูกประกาศตามเดิม
        — การมาจากข้างนอกไม่ใช่ข้อยกเว้นให้ field โครงสร้าง
      why_not_per_field: >-
        ถ้าประกาศ field ของเขาในใบเรา schema เขาขยับทีนึง CI เราแดงจนกว่าจะตามแก้
        · และทำให้เรายืนยันว่า metadata.why ถืออะไรและกฎการเก็บอยู่ชั้นไหน
        ทั้งที่ไม่ได้เขียนมันเอง — คำตอบที่มั่นใจแต่ผิด แย่กว่าช่องว่างที่เห็น
      what_we_still_owe: >-
        rfcs/0015 Decision 3 — ห้ามคัดค่าจาก metadata ของ external event
        ไปใส่ field ที่ repo นี้เขียน · เราบังคับไม่ได้ว่าข้อความของเขามีอะไร
        แต่บังคับได้ว่าเราไม่เป็นเหตุให้มันกระจาย
      producers:
        - system: ecosystem-intelligence
          declaration: https://github.com/monthop-gmail/ecosystem-intelligence/blob/main/platform-contract.yaml
          declares: >-
            text_fields → $.metadata.question (ADVISORY_ISSUED) · written_by: human
            · พร้อม retention_layer ที่บอกชั้นของกฎตามข้อ 3 ของ invariant
          checked_at: "2026-09-18"
          evidence: >-
            บล็อก text_fields อยู่ที่บรรทัด 59 ของใบเขา · ลงตั้งแต่ commit
            2026-09-17T16:51 "contracts: re-pin ไป semantics 1.3 + ประกาศ leaf
            ที่ถือข้อความของมนุษย์" — เขาทำเองโดยไม่มีใครแจ้ง หลังเห็นว่า
            semantics_version ขยับ
          their_note: >-
            metadata.question เป็น leaf เดียวของเขาที่คุมเนื้อหาไม่ได้ — /ask
            เปิดให้พิมพ์อิสระ วันนี้ emit ยิงค่าคงที่ตามรอบ แต่ถ้ามีคนถามด้วยข้อความ
            ที่มีข้อมูลส่วนบุคคล มันจะไหลมาที่นี่ · เขาเขียนข้อนี้ไว้เองในใบ
          retention_layer: >-
            ของเขาบอกว่า "ลบราย field ไม่ได้ · เราไม่ได้เป็นเจ้าของ store —
            กติกาการเก็บอยู่ที่ store ของผู้รับ" ซึ่งชี้กลับมาที่เรา · ฝั่งเรา
            EventLog เป็น append-only และยังอยู่ในหน่วยความจำ ดู text_fields.declared
            ของ repo นี้สำหรับชั้นที่กฎอยู่จริงวันนี้
          review_by: "2026-10-31"
          review_by_reason: >-
            วันเดียวกับ backstop ของ issue #32 — เป็นวันที่ event ของเขาอาจไหลมาถึงจริง
            · ใบประกาศที่ไม่มีใครกลับไปอ่านก็เก่าได้เหมือนกัน โดยเฉพาะเมื่อ
            "leaf เดียวที่คุมเนื้อหาไม่ได้" อาจไม่ใช่ข้อเดียวอีกต่อไป

          # ⚠️ แก้เมื่อ 2026-09-18 — รายการเดิมเขียนว่า declaration: none พร้อมคำว่า
          # "ตรวจแล้วไม่ได้เดา" และ **ผิด** · บล็อกของเขามีอยู่ก่อนที่เราจะตรวจแล้ว
          #
          # สาเหตุ: คำสั่งที่ใช้ตรวจจบด้วย `| head -5` ซึ่ง exit 0 เสมอ ทำให้
          # "ดึงไฟล์ไม่สำเร็จ" · "ไม่มีไฟล์" · "มีไฟล์แต่ไม่เจอ pattern"
          # ให้ผลลัพธ์หน้าตาเดียวกันหมด คือว่างเปล่า · แล้วเราอ่านความว่างนั้น
          # ว่าเป็นหลักฐานว่าไม่มี
          #
          # เป็นรูปเดียวกับที่ repo นี้ไล่จับมาตลอด — ผลลัพธ์สีเขียวที่แปลว่า
          # "ไม่มีอะไรรัน" ไม่ใช่ "รันแล้วไม่เจอ" · ต่างกันตรงที่รอบนี้เราเอาไป
          # เขียนลงใบของตัวเองและบอกทีมอื่นด้วย (issue #32) — แก้ทั้งสองที่แล้ว
        - system: navi-ims
          declaration: n/a — fixture
          checked_at: "2026-09-18"
          evidence: >-
            ไม่ใช่ระบบจริง · เป็นผู้ผลิตสมมติที่ conformance/payload_check.py กับ
            simulation/ ใช้แทน "ของที่มาจากข้างนอก" · ไม่มี repo ต้นทาง
          retention_layer: >-
            ของเรา — metadata ของใบนี้เขียนโดย fixture ในรีโปนี้เอง ไม่ใช่โดยใครข้างนอก
            ดังนั้นกฎ leaf ตาม rfcs/0013 ใช้กับมันเต็มรูป และ metadata.record_type
            ก็อยู่ในรายการตัวชี้อยู่แล้ว
          consequence: >-
            รายการนี้มีเพื่อให้การเพิ่มผู้ผลิตใหม่เข้า scenario ต้องบอกว่ามันคืออะไร
            · ถ้าวันหนึ่ง navi-ims กลายเป็นระบบจริง รายการนี้ผิดทันทีและต้องแก้
          review_by: "2026-12-31"
          review_by_reason: >-
            ไม่มีเหตุให้เร่ง — ไม่มีข้อความของใครข้างนอกไหลผ่านทางนี้
            · วันที่มีไว้เพื่อไม่ให้รายการอยู่ถาวรโดยไม่มีใครกลับมาอ่าน
        # care-agent-platform ไม่ได้อยู่ในรายการนี้เพราะยังไม่เคยส่ง event มาที่ intake ของเรา
        # · ถ้าวันหนึ่งส่ง ใบของเขามี text_fields พร้อม written_by ทุก path อยู่แล้ว (ADR-0011/0012)

    platform_may_add_freely:
      - event type ใหม่                     # rfcs/0009 — เดิมเป็น semantic change
      - tenant_id
      - workspace_id
      - correlation_id
      - subject_type / subject_id  # rfcs/0008 ต้องการให้มี ส่วนชื่อและ enum เป็นของ agent-platform
      - cost attribution
      - trace / span identifier
      - อื่น ๆ ที่ไม่เปลี่ยนความหมายของ event

